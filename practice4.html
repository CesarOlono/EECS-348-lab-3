<?php
if (isset($_GET['num'])) {
    $n = (int)$_GET['num'];
    echo "<table border='1'>";
    echo "<tr><td></td>";
    for ($i = 1; $i <= $n; $i++) echo "<td>$i</td>";
    echo "</tr>";
    for ($i = 1; $i <= $n; $i++) {
        echo "<tr><td>$i</td>";
        for ($j = 1; $j <= $n; $j++) {
            echo "<td>" . ($i * $j) . "</td>";
        }
        echo "</tr>";
    }
    echo "</table>";
}
?>
